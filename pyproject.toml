

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "agentledger"
version = "0.3.2"
description = "A lightweight audit ledger SDK for AI agents."
readme = "README.md"
requires-python = ">=3.9"
authors = [
    { name = "AgentLedger" }
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8,<9"]

[tool.setuptools.packages.find]
include = ["agentledger*", "examples*"]
exclude = ["screenshots*"]
